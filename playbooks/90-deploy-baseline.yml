---
- name: G8825Z5 baseline deployment
  hosts: g8825z5
  become: true
  gather_facts: true
  serial: 1
  vars:
    preflight_components: [rocm, broadcom, pensando]
  vars_files:
    - ../group_vars/all/cluster.yml
    - ../vars/software_catalog.yml
  pre_tasks:
    - name: Validate source of truth
      ansible.builtin.include_role:
        name: cluster_preflight
    - name: Validate software artifacts
      ansible.builtin.include_role:
        name: artifact_preflight
  roles:
    - kernel_baseline
    - network_baseline
    - rocm
    - broadcom
    - pensando
