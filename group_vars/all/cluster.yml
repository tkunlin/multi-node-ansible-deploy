---
# G8825Z5 single source of truth
sku_name: G8825Z5
target_os: ubuntu-2404

# Desired software versions
target_rocm: "7.2.3"
target_nic_bcm: "238.1.138.6a"
target_nic_amd: "1.117.5-a-38"

# Kernel baseline
target_kernel: "6.8.0-134-generic"
disable_unattended_upgrades: true
kernel_set_grub_default: true
auto_reboot: false

# Artifact locations
artifact_root: "{{ inventory_dir }}/../artifacts"
remote_artifact_dir: /opt/firstboot

# Hardware detection
broadcom_pci_id: "14e4:1760"
pensando_pci_id: "1dd8:1002"

# ROCm installer arguments
rocm_installer_args:
  - rocm
  - target=/opt
  - gpu-access=all
  - postrocm

# Runtime management network
runtime_network:
  interface: ens512np0
  prefix: 23
  gateway: 10.99.233.254
  dns:
    - 10.88.1.86
    - 10.88.0.23

# Netplan: omit renderer to use Ubuntu Server/Netplan default backend.
netplan_renderer: ""
netplan_mtu: 9000
network_apply: false

# 8 Pensando rails. name_glob tolerates enpXs0 and enpXs0np0 naming.
backend_rails:
  - { slot: 1,  name_glob: "enp102s0*", lane: 0 }
  - { slot: 2,  name_glob: "enp118s0*", lane: 1 }
  - { slot: 3,  name_glob: "enp22s0*",  lane: 2 }
  - { slot: 4,  name_glob: "enp6s0*",   lane: 3 }
  - { slot: 9,  name_glob: "enp246s0*", lane: 4 }
  - { slot: 10, name_glob: "enp230s0*", lane: 5 }
  - { slot: 11, name_glob: "enp134s0*", lane: 6 }
  - { slot: 12, name_glob: "enp150s0*", lane: 7 }

# Rack-pair backend subnet bases. Each pair owns 8 /24 rails.
backend_fabric_pairs:
  1: { racks: [1, 2], subnet_base: 11 }
  2: { racks: [3, 4], subnet_base: 21 }
  3: { racks: [5, 6], subnet_base: 31 }
  4: { racks: [7, 8], subnet_base: 41 }

# Node metadata. provisioning_fe/oob values come from pod_cluster_config.ini.
